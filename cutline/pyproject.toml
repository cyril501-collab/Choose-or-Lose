[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutline"
version = "0.1.0"
description = "Moteur de montage vidéo professionnel avec analyse de scénario, dérushage et montage automatique (bandes-annonces, previously, coming next, sujets JT)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
transcription = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
cutline = "cutline.cli:main"

[tool.setuptools.package-data]
cutline = ["data/*.fountain"]

[tool.setuptools.packages.find]
include = ["cutline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
